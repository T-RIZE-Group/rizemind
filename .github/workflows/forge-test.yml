name: Forge Test

# Pushes are filtered to inputs that feed `forge build` / `forge test`. Pull
# requests always create the job because a workflow skipped by a path filter
# leaves a required check pending; an initial diff check avoids installing
# Foundry or running the suite when the PR does not touch those inputs.
on:
  push:
    branches:
      - "*"
    paths:
      - "forge/src/**"
      - "forge/test/**"
      - "forge/script/**"
      - "forge/foundry.toml"
      - "forge/remappings.txt"
      - "forge/soldeer.lock"
      - ".github/workflows/forge-test.yml"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check for Forge changes
        if: github.event_name == 'pull_request'
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          relevant=false
          while IFS= read -r path; do
            case "$path" in
              forge/src/*|forge/test/*|forge/script/*|forge/foundry.toml|forge/remappings.txt|forge/soldeer.lock|.github/workflows/forge-test.yml)
                relevant=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "forge=$relevant" >> "$GITHUB_OUTPUT"

      - name: No Forge changes
        if: github.event_name == 'pull_request' && steps.changes.outputs.forge != 'true'
        run: echo "No Forge inputs changed; required check satisfied without running the suite."

      - name: Install Foundry
        if: github.event_name != 'pull_request' || steps.changes.outputs.forge == 'true'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned exactly rather than `nightly`: the mutation gate compares
          # scores across runs, which is only meaningful on a fixed toolchain.
          version: v1.8.1

      - name: Install Dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.forge == 'true'
        working-directory: forge
        run: forge soldeer install

      - name: Run Forge build
        if: github.event_name != 'pull_request' || steps.changes.outputs.forge == 'true'
        working-directory: forge
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Run Forge tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.forge == 'true'
        working-directory: forge
        run: |
          forge test -vvv
        id: test
