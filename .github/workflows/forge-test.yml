name: Forge Test

# Only the paths that actually feed `forge build` / `forge test`. Notably absent:
# `forge/broadcast` (deployment logs), `forge/mutation` (the mutation gate's own
# tooling, which has its own workflow) and the shell/markdown files, none of
# which can change the outcome of this job. The push and pull_request lists are
# kept identical — GitHub Actions does not support YAML anchors, so they have to
# be edited together.
on:
  push:
    branches:
      - "*"
    paths:
      - "forge/src/**"
      - "forge/test/**"
      - "forge/script/**"
      - "forge/foundry.toml"
      - "forge/remappings.txt"
      - "forge/soldeer.lock"
      - ".github/workflows/forge-test.yml"
  pull_request:
    branches:
      - "*"
    paths:
      - "forge/src/**"
      - "forge/test/**"
      - "forge/script/**"
      - "forge/foundry.toml"
      - "forge/remappings.txt"
      - "forge/soldeer.lock"
      - ".github/workflows/forge-test.yml"
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned exactly rather than `nightly`: the mutation gate compares
          # scores across runs, which is only meaningful on a fixed toolchain.
          version: v1.8.1

      - name: Install Dependencies
        working-directory: forge
        run: forge soldeer install

      - name: Run Forge build
        working-directory: forge
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Run Forge tests
        working-directory: forge
        run: |
          forge test -vvv
        id: test
